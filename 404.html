<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | K. Agyemang Auto Parts</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <!-- GitHub Pages serves this page for any missing address, including nested ones,
       so this script finds the site's root folder and fixes the links below. -->
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var onProjectSite = /\.github\.io$/.test(location.hostname) && parts.length > 0;
      var base = onProjectSite ? "/" + parts[0] + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; background:#000; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; line-height:1.6; }
    main { max-width:34rem; }
    h1 { margin:0 0 .75rem; font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif; font-size:clamp(2.6rem,9vw,4.5rem); line-height:.95; }
    p { color:#d8d8d4; }
    a { display:inline-block; margin:.5rem .75rem .5rem 0; padding:.85rem 1.4rem; background:#d71920; color:#fff; font-weight:600; text-decoration:none; border-radius:3px; }
    a.alt { background:transparent; border:2px solid #fff; padding:calc(.85rem - 2px) calc(1.4rem - 2px); }
    a:focus-visible { outline:3px solid #ff5459; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>We could not find that page.</h1>
    <p>The link may be old or mistyped. You can go back to the homepage or start a part request.</p>

  </main>
</body>
</html>
